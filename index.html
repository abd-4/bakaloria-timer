<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت الأوائل التعليمي - مؤقت الامتحان</title>
    <style>
        body {
            background-color: #0d1b2a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: #00b4d8;
            margin: 5px 0;
        }

        .header p {
            font-size: 14px;
            color: #90e0ef;
            margin: 0;
        }

        .exam-date {
            background-color: #1b263b;
            padding: 5px 15px;
            border-radius: 15px;
            font-size: 12px;
            color: #e0e1dd;
            margin-top: 10px;
            display: inline-block;
        }

        .timer-container {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .circle-box {
            position: relative;
            width: 75px;
            height: 75px;
            border: 4px solid #00b4d8;
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 10px rgba(0, 180, 216, 0.5);
        }

        .circle-box .number {
            font-size: 20px;
            font-weight: bold;
        }

        .circle-box .label {
            font-size: 11px;
            color: #90e0ef;
        }

        .progress-container {
            width: 90%;
            max-width: 400px;
            background-color: #1b263b;
            padding: 15px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .bar {
            background-color: #0d1b2a;
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
        }

        .fill {
            height: 100%;
            width: 92.9%; /* يمكنك تعديل النسبة هنا */
            background: linear-gradient(90deg, #0077b6, #00b4d8);
            border-radius: 10px;
        }

        .footer-note {
            margin-top: 30px;
            font-size: 12px;
            color: #a2a2a2;
            text-align: center;
            max-width: 300px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>بوت الأوائل التعليمي</h1>
        <p>كل ثانية تقربك من الحلم 🌟</p>
        <div class="exam-date">موعد الامتحان النهائي: 2026-06-06</div>
    </div>

    <div class="timer-container">
        <div class="circle-box">
            <div class="number" id="seconds">00</div>
            <div class="label">ثانية</div>
        </div>
        <div class="circle-box">
            <div class="number" id="minutes">00</div>
            <div class="label">دقيقة</div>
        </div>
        <div class="circle-box">
            <div class="number" id="hours">00</div>
            <div class="label">ساعة</div>
        </div>
        <div class="circle-box">
            <div class="number" id="days">00</div>
            <div class="label">يوم</div>
        </div>
    </div>

    <div class="progress-container">
        <div class="progress-text">
            <span>مؤشر تقدم رحلة البكالوريا</span>
            <span style="color: #00b4d8;">92.9%</span>
        </div>
        <div class="bar">
            <div class="fill"></div>
        </div>
    </div>

    <div class="footer-note">
        حلمك جدير بأن تبذل في سبيله الجهد، أيام الامتحان تمضي مسرعة فاصنع لنفسك مجداً يفخر به الجميع.
    </div>

    <script>
        // تعيين تاريخ الامتحان النهائي لعام 2026
        const examDate = new Date("June 6, 2026 08:00:00").getTime();

        const countdown = setInterval(function() {
            const now = new Date().getTime();
            const distance = examDate - now;

            // حساب الأيام، الساعات، الدقائق والثواني
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // عرض النتائج في العناصر
            document.getElementById("days").innerHTML = days;
            document.getElementById("hours").innerHTML = hours;
            document.getElementById("minutes").innerHTML = minutes;
            document.getElementById("seconds").innerHTML = seconds;

            // إذا انتهى الوقت
            if (distance < 0) {
                clearInterval(countdown);
                document.querySelector(".timer-container").innerHTML = "<h3>بدأت الامتحانات! بالتوفيق للأوائل 🎯</h3>";
            }
        }, 1000);
    </script>

</body>
</html>
