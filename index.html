<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت الأوائل التعليمي - مؤقت الامتحان</title>
    <!-- استدعاء خط Cairo لإعطاء مظهر عصري وأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة القصاصات الورقية (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.7);
            --accent-color: #00b4d8;
            --accent-glow: rgba(0, 180, 216, 0.5);
            --text-main: #ffffff;
            --text-sub: #90e0ef;
            --gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
            overflow-x: hidden;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 24px;
            padding: 35px 20px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                        0 0 30px var(--accent-glow);
            position: relative;
        }

        /* الملاحظة العلوية التنبيهية */
        .disclaimer-badge {
            background: rgba(0, 180, 216, 0.12);
            border: 1px dashed var(--accent-color);
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            color: #72efdd;
            display: inline-block;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .header h1 {
            font-size: 30px;
            font-weight: 800;
            color: #ffffff;
            margin: 0 0 6px 0;
            letter-spacing: -0.5px;
        }

        .header p {
            font-size: 14px;
            color: var(--text-sub);
            margin: 0 0 15px 0;
            font-weight: 600;
        }

        .exam-date {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 12px;
            color: #e0e1dd;
            display: inline-block;
            margin-bottom: 30px;
            font-weight: 600;
        }

        /* العدادات بشكل أفقي متناسق وراء بعضها */
        .timer-container {
            display: flex;
            gap: 10px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            direction: ltr;
            width: 100%;
        }

        .circle-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            flex: 1;
        }

        .svg-circle-box {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .svg-circle-box svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .circle-bg {
            fill: none;
            stroke: rgba(255, 255, 255, 0.08);
            stroke-width: 6;
        }

        /* حلقة دائرية نظيفة تماماً بدون كرات برتقالية */
        .circle-progress {
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 6;
            stroke-linecap: round;
            stroke-dasharray: 251.2;
            stroke-dashoffset: 0;
            filter: drop-shadow(0px 0px 6px var(--accent-color));
            transition: stroke-dashoffset 0.8s ease-in-out;
        }

        .circle-box-content {
            position: absolute;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .circle-box-content .number {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .unit-label {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 8px;
            font-weight: 700;
        }

        .progress-container {
            background: rgba(11, 19, 43, 0.6);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            margin-bottom: 25px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .progress-percent {
            color: var(--accent-color);
        }

        .bar {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #48cae4, #00b4d8);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-color);
            transition: width 0.5s ease;
        }

        .footer-note {
            font-size: 12px;
            color: #a0aec0;
            line-height: 1.7;
            margin: 0;
        }

        .finished-title {
            color: var(--gold);
            font-size: 22px;
            font-weight: 800;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        @media (max-width: 420px) {
            .svg-circle-box {
                width: 70px;
                height: 70px;
            }
            .circle-box-content .number {
                font-size: 18px;
            }
            .unit-label {
                font-size: 11px;
            }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="disclaimer-badge">
            📌 المؤقت تقريبي - لم يتحدد الموعد رسمياً
        </div>

        <div class="header">
            <h1>مؤقت الامتحان</h1>
            <p>كل ثانية تقربك من الحلم 🌟</p>
            <div class="exam-date">📅 موعد الامتحان المتوقع: 2027-06-06 (AM 08:00)</div>
        </div>

        <div class="timer-container" id="timer-box">
            <!-- الأيام -->
            <div class="circle-wrapper">
                <div class="svg-circle-box">
                    <svg viewBox="0 0 100 100">
                        <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
                        <circle class="circle-progress" id="days-circle" cx="50" cy="50" r="40"></circle>
                    </svg>
                    <div class="circle-box-content">
                        <span class="number" id="days">00</span>
                    </div>
                </div>
                <span class="unit-label">يوم</span>
            </div>

            <!-- الساعات -->
            <div class="circle-wrapper">
                <div class="svg-circle-box">
                    <svg viewBox="0 0 100 100">
                        <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
                        <circle class="circle-progress" id="hours-circle" cx="50" cy="50" r="40"></circle>
                    </svg>
                    <div class="circle-box-content">
                        <span class="number" id="hours">00</span>
                    </div>
                </div>
                <span class="unit-label">ساعة</span>
            </div>

            <!-- الدقائق -->
            <div class="circle-wrapper">
                <div class="svg-circle-box">
                    <svg viewBox="0 0 100 100">
                        <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
                        <circle class="circle-progress" id="minutes-circle" cx="50" cy="50" r="40"></circle>
                    </svg>
                    <div class="circle-box-content">
                        <span class="number" id="minutes">00</span>
                    </div>
                </div>
                <span class="unit-label">دقيقة</span>
            </div>

            <!-- الثواني -->
            <div class="circle-wrapper">
                <div class="svg-circle-box">
                    <svg viewBox="0 0 100 100">
                        <circle class="circle-bg" cx="50" cy="50" r="40"></circle>
                        <circle class="circle-progress" id="seconds-circle" cx="50" cy="50" r="40"></circle>
                    </svg>
                    <div class="circle-box-content">
                        <span class="number" id="seconds">00</span>
                    </div>
                </div>
                <span class="unit-label">ثانية</span>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-text">
                <span>مؤشر تقدم رحلة البكالوريا</span>
                <span class="progress-percent" id="percent-text">0.0%</span>
            </div>
            <div class="bar">
                <div class="fill" id="progress-fill"></div>
            </div>
        </div>

        <p class="footer-note">
            حلمك جدير بأن تبذل في سبيله الجهد، أيام الامتحان تمضي مسرعة فاصنع لنفسك مجداً يفخر به الجميع.
        </p>
    </div>

    <script>
        const startDate = new Date("September 1, 2026 00:00:00").getTime();
        const examDate = new Date("June 6, 2027 08:00:00").getTime();
        const totalDuration = examDate - startDate;

        const CIRCLE_RADIUS = 40;
        const CIRCLE_CIRCUMFERENCE = 2 * Math.PI * CIRCLE_RADIUS;

        let confettiTriggered = false;

        function updateRing(circleId, value, maxValue) {
            const circle = document.getElementById(circleId);
            if (!circle) return;

            const fraction = value / maxValue;
            const strokeDashoffset = CIRCLE_CIRCUMFERENCE * (1 - fraction);
            circle.style.strokeDasharray = CIRCLE_CIRCUMFERENCE;
            circle.style.strokeDashoffset = strokeDashoffset;
        }

        function updateTimer() {
            const now = new Date().getTime();
            const distance = examDate - now;

            const timePassed = now - startDate;
            let percentage = (timePassed / totalDuration) * 100;

            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            const formattedPercent = percentage.toFixed(1) + "%";
            document.getElementById("percent-text").innerText = formattedPercent;
            document.getElementById("progress-fill").style.width = percentage + "%";

            if (distance <= 0) {
                clearInterval(countdown);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                
                document.getElementById("percent-text").innerText = "100%";
                document.getElementById("progress-fill").style.width = "100%";

                document.getElementById("timer-box").innerHTML = 
                    '<div class="finished-title">🎓 بدأت الامتحانات! بالتوفيق للأوائل 🎯</div>';

                if (!confettiTriggered) {
                    launchConfetti();
                    confettiTriggered = true;
                }
                return;
            }

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;

            updateRing("seconds-circle", seconds, 60);
            updateRing("minutes-circle", minutes, 60);
            updateRing("hours-circle", hours, 24);
            updateRing("days-circle", days % 365, 365);
        }

        function launchConfetti() {
            var duration = 7 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 6,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ffd700', '#00b4d8', '#ffffff']
                });
                confetti({
                    particleCount: 6,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ffd700', '#00b4d8', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        updateTimer();
        const countdown = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
