<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوت الأوائل التعليمي - مؤقت الامتحان</title>
    <!-- استدعاء خط Cairo لإعطاء مظهر عصري وأنيق -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
    <!-- مكتبة القصاصات الورقية (Confetti) -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #0b132b;
            --card-bg: rgba(28, 37, 65, 0.65);
            --accent-color: #00b4d8;
            --accent-glow: rgba(0, 180, 216, 0.4);
            --text-main: #ffffff;
            --text-sub: #90e0ef;
            --gold: #ffd700;
        }

        * {
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            background: radial-gradient(circle at center, #1c2541 0%, #0b132b 100%);
            color: var(--text-main);
            font-family: 'Cairo', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        .main-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5),
                        0 0 30px var(--accent-glow);
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--accent-color);
            margin: 0 0 8px 0;
            text-shadow: 0 0 10px var(--accent-glow);
        }

        .header p {
            font-size: 15px;
            color: var(--text-sub);
            margin: 0 0 15px 0;
            font-weight: 600;
        }

        .exam-date {
            background: rgba(0, 180, 216, 0.15);
            border: 1px solid var(--accent-color);
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 13px;
            color: var(--text-sub);
            display: inline-block;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .timer-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 35px;
            direction: ltr;
        }

        .circle-box {
            position: relative;
            width: 85px;
            height: 95px;
            background: rgba(11, 19, 43, 0.8);
            border: 2px solid var(--accent-color);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px var(--accent-glow);
        }

        .circle-box .number {
            font-size: 26px;
            font-weight: 800;
            color: #ffffff;
            line-height: 1;
        }

        .circle-box .label {
            font-size: 12px;
            color: var(--text-sub);
            margin-top: 6px;
            font-weight: 600;
        }

        .progress-container {
            background: rgba(11, 19, 43, 0.6);
            padding: 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            margin-bottom: 25px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 14px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .progress-percent {
            color: var(--accent-color);
        }

        .bar {
            background-color: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            height: 12px;
            width: 100%;
            overflow: hidden;
            position: relative;
        }

        .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #48cae4, #00b4d8);
            border-radius: 10px;
            box-shadow: 0 0 10px var(--accent-color);
            transition: width 0.5s ease;
        }

        .footer-note {
            font-size: 13px;
            color: #a0aec0;
            line-height: 1.7;
            margin: 0;
        }

        .finished-title {
            color: var(--gold);
            font-size: 24px;
            font-weight: 800;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="main-card">
        <div class="header">
            <h1>بوت الأوائل التعليمي</h1>
            <p>كل ثانية تقربك من الحلم 🌟</p>
            <div class="exam-date">📅 موعد الامتحان النهائي: 2027-06-06 (08:00 AM)</div>
        </div>

        <div class="timer-container" id="timer-box">
            <div class="circle-box">
                <div class="number" id="days">00</div>
                <div class="label">يوم</div>
            </div>
            <div class="circle-box">
                <div class="number" id="hours">00</div>
                <div class="label">ساعة</div>
            </div>
            <div class="circle-box">
                <div class="number" id="minutes">00</div>
                <div class="label">دقيقة</div>
            </div>
            <div class="circle-box">
                <div class="number" id="seconds">00</div>
                <div class="label">ثانية</div>
            </div>
        </div>

        <div class="progress-container">
            <div class="progress-text">
                <span>مؤشر تقدم رحلة البكالوريا</span>
                <span class="progress-percent" id="percent-text">0%</span>
            </div>
            <div class="bar">
                <div class="fill" id="progress-fill"></div>
            </div>
        </div>

        <p class="footer-note">
            حلمك جدير بأن تبذل في سبيله الجهد، أيام الامتحان تمضي مسرعة فاصنع لنفسك مجداً يفخر به الجميع.
        </p>
    </div>

    <script>
        // ضبط تاريخ البداية والنهاية لحساب النسبة المئوية بدقة من 0% حتى 100%
        // افترضنا بداية العام الدراسي من 1 سبتمبر 2026 حتى موعد الامتحان 6 يونيو 2027
        const startDate = new Date("September 1, 2026 00:00:00").getTime();
        const examDate = new Date("June 6, 2027 08:00:00").getTime();
        const totalDuration = examDate - startDate;

        let confettiTriggered = false;

        function updateTimer() {
            const now = new Date().getTime();
            const distance = examDate - now;

            // 1. حساب النسبة المئوية المكتملة لرحلة الوقت
            const timePassed = now - startDate;
            let percentage = (timePassed / totalDuration) * 100;

            if (percentage < 0) percentage = 0;
            if (percentage > 100) percentage = 100;

            // تحديث النسبة في الشاشة
            const formattedPercent = percentage.toFixed(1) + "%";
            document.getElementById("percent-text").innerText = formattedPercent;
            document.getElementById("progress-fill").style.width = percentage + "%";

            // 2. إذا انتهى الوقت تماماً
            if (distance <= 0) {
                clearInterval(countdown);
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
                
                document.getElementById("percent-text").innerText = "100%";
                document.getElementById("progress-fill").style.width = "100%";

                document.getElementById("timer-box").innerHTML = 
                    '<div class="finished-title">🎓 بدأت الامتحانات! بالتوفيق للأوائل 🎯</div>';

                // إطلاق القصاصات الذهبية والاحتفالية
                if (!confettiTriggered) {
                    launchConfetti();
                    confettiTriggered = true;
                }
                return;
            }

            // 3. حساب الوقت المتبقي
            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            // إضافة الصفر الهامشي للأرقام الأقل من 10
            document.getElementById("days").innerText = days < 10 ? "0" + days : days;
            document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
            document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
            document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
        }

        // إطلاق الاحتفال بالقصاصات الذهبية
        function launchConfetti() {
            var duration = 7 * 1000;
            var end = Date.now() + duration;

            (function frame() {
                confetti({
                    particleCount: 5,
                    angle: 60,
                    spread: 55,
                    origin: { x: 0 },
                    colors: ['#ffd700', '#00b4d8', '#ffffff']
                });
                confetti({
                    particleCount: 5,
                    angle: 120,
                    spread: 55,
                    origin: { x: 1 },
                    colors: ['#ffd700', '#00b4d8', '#ffffff']
                });

                if (Date.now() < end) {
                    requestAnimationFrame(frame);
                }
            }());
        }

        // تشغيل المؤقت وتحديثه كل ثانية
        updateTimer();
        const countdown = setInterval(updateTimer, 1000);
    </script>
</body>
</html>
